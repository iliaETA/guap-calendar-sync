name: Sync GUAP schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: guap-schedule-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download, validate, notify and build calendar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAIL_CALDAV_USERNAME: ${{ secrets.MAIL_CALDAV_USERNAME }}
          MAIL_CALDAV_APP_PASSWORD: ${{ secrets.MAIL_CALDAV_APP_PASSWORD }}
          MAIL_CALENDAR_NAME: ${{ vars.MAIL_CALENDAR_NAME || 'ГУАП' }}
        run: python -m src.main
      - name: Save the new snapshot and calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json docs/calendar.ics
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync GUAP schedule"
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload calendar site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy calendar site
        id: deployment
        uses: actions/deploy-pages@v5
